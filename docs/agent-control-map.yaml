schema_version: 2
path_base: repository-root

# Static topology only. Never store task progress, live runtime state,
# qualification status, or mutable agent memory here.
purpose: >-
  Provide one machine-readable source for forward behavior-to-owner routing and
  reverse changed-path-to-impact analysis.

authority:
  implementation_truth: implementation and executable contracts
  topology_truth: docs/agent-control-map.yaml
  qualification_truth: docs/qualification/
  human_projection: ARCHITECTURE.md

path_resolution:
  strategy: documentation-classification-first-then-most-specific-runtime-path
  documentation_override:
    patterns: ['**/*.md', docs/**/*.yaml]
    route_to: documentation boundaries
    exclude_from_runtime_boundaries: true
  precedence:
    - exact path
    - documentation override
    - most-specific matching runtime glob
  ambiguity: If more than one runtime boundary remains at the same specificity, emit an unknown owner and stop before changing or verifying.
  unmatched: Emit an unknown topology match and repair the map before relying on reverse-impact results.

maintenance:
  trigger: A boundary owner, owned path, cross-boundary interface topology or impact trigger, invariant link, evidence family, or verification dimension changes.
  inputs:
    - changed implementation and executable contracts
    - affected module documentation
    - qualification invalidation rules
  procedure:
    - update the smallest affected boundary entries
    - encode each cross-boundary seam once as interface-topology metadata with an explicit owner and impact trigger; leave executable payload/type contracts in implementation
    - update the ARCHITECTURE.md human projection when its routing meaning changes
    - run syntax, reference, path-coverage, interface-endpoint, and ownership checks
  output: A static topology that supports forward routing and reverse impact analysis.
  constraints:
    - no task progress, live state, support status, or agent memory
    - no interface added only for possible future coupling
    - interface membership supplies impact candidates, never automatic invalidation verdicts
  failure_modes:
    - unmatched owned path hides impact
    - missing or over-broad interface produces incomplete or wasteful traversal
    - copied qualification status turns topology into a competing truth source

example_queries:
  forward: tool result absent from chat input -> CONTENT_ORCHESTRATION; escalate to SITE_ADAPTERS only if delivery evidence reaches the page insertion seam
  reverse: changed adapter path -> SITE_ADAPTERS -> relevant interfaces, invariants, evidence, and verification dimensions

invariants:
  # `statement` is a retrieval label only. The referenced owning document is the
  # normative home of the invariant; do not treat this map as a second specification.
  BOUNDARY_OWNERSHIP:
    statement: Site DOM behavior belongs in adapters; protocol behavior belongs in the MCP client; cross-tab connection lifecycle belongs in the background service worker.
    reference: SYSTEM.md#system-invariants-for-agents
  CONNECTION_STATE_MACHINE:
    statement: The connection lifecycle has exactly disconnected, connecting, connected, error, and reconnecting states.
    reference: SYSTEM.md#connection-state-machine
  OPERATION_CHECKPOINTS:
    statement: Runtime claims cite the highest confirmed C1-C6 checkpoint; C7 is outside extension observation.
    reference: SYSTEM.md#operation-checkpoint-ladder
  EFFECT_SAFE_RETRY:
    statement: Retry safety is end-to-end; explicit and hidden lower-layer redispatches require checkpoint/effect evidence and uncertain effects after C3 are never blindly replayed.
    reference: SYSTEM.md#operation-effect-classes
  CHECKPOINT_MONOTONICITY:
    statement: A later failure cannot erase an earlier confirmed checkpoint within the same attempt.
    reference: SYSTEM.md#system-invariants-for-agents
  DESTINATION_INTEGRITY:
    statement: Delayed delivery and submission remain bound to the authorized destination and current preferences.
    reference: ARCHITECTURE.md#transition-and-recovery-rules
  ONE_FACT_ONE_HOME:
    statement: Every durable fact has one authoritative abstraction level; other locations link or provide scoped evidence.
    reference: AGENTS.md#documentation-locality
  ABSTRACTION_GRADIENT:
    statement: Higher documentation layers compress and route; dynamic lower-level inventories, snippets, issue history, commands, and qualification detail stay with their narrow owner.
    reference: AGENTS.md#abstraction-gradient
  QUALIFICATION_IS_SCOPED:
    statement: Registration, implementation presence, and qualification are distinct claims.
    reference: SYSTEM.md#system-invariants-for-agents
  DEPENDENCY_SCOPED_EVIDENCE:
    statement: Evidence freshness follows material source/artifact/environment dependencies rather than unrelated repository age or commit movement.
    reference: docs/qualification/README.md#machine-comparable-dependency-scope
  ACTION_ADMISSION:
    statement: Every action requires current authority and every terminal outcome is evaluated against explicit acceptance evidence.
    reference: ARCHITECTURE.md#transition-and-recovery-rules

evidence_families:
  ISSUE_DISPOSITION: docs/qualification/issue-coverage-ledger.md
  OPERATION_ROUND_TRIP: docs/qualification/round-trip-baseline.md
  SUPPORT_QUALIFICATION: docs/qualification/support-matrix.md
  AGENT_RETRIEVAL: docs/qualification/accretion-demonstration.md

# Interfaces are recorded once as topology metadata. `contract` is a short semantic
# label for routing, not an executable schema or a replacement for producer/consumer
# source. Traverse participant membership in either direction; inspect `impact_when`
# before treating another participant as affected.
interfaces:
  - id: CONTENT_BACKGROUND_MESSAGES
    owner: SHARED_CONTRACTS
    participants: [CONTENT_ORCHESTRATION, BACKGROUND_LIFECYCLE, SHARED_CONTRACTS]
    contract: Content/background request-response envelopes, identifiers, and broadcasts.
    impact_when: Message shape, serialization, routing, correlation, request retry/attempt semantics, or lifecycle semantics change.

  - id: BACKGROUND_MCP_SESSION
    owner: BACKGROUND_LIFECYCLE
    participants: [BACKGROUND_LIFECYCLE, MCP_CLIENT, SHARED_CONTRACTS]
    contract: Background-owned client lifecycle, request dispatch, and client-event projection.
    impact_when: Client creation, connection ownership, request forwarding, event mapping, or cancellation changes.

  - id: MCP_TRANSPORT_SESSION
    owner: MCP_CLIENT
    participants: [MCP_CLIENT, TRANSPORT_PLUGINS]
    contract: Transport selection, framing, connection lifecycle, and protocol result normalization.
    impact_when: Plugin interface, framing, URI selection, reconnect, health, or result semantics change.

  - id: CONTENT_STATE_EVENT_FLOW
    owner: CONTENT_STATE_EVENTS
    participants: [CONTENT_ORCHESTRATION, CONTENT_STATE_EVENTS, UI_COMPONENTS, SHARED_CONTRACTS]
    contract: Zustand state, typed events, hooks, and their content/UI consumers.
    impact_when: Store shape, event payload, subscription, initialization, or consumer-visible state semantics change.

  - id: ADAPTER_LIFECYCLE
    owner: SITE_ADAPTERS
    participants: [SITE_ADAPTERS, CONTENT_ORCHESTRATION, CONTENT_STATE_EVENTS]
    contract: Hostname selection, adapter activation, capabilities, and automation method invocation.
    impact_when: Registry matching, lifecycle, capability, adapter method, or active-adapter state changes.

  - id: RENDERER_COMPLETION
    owner: RENDERER
    participants: [RENDERER, CONTENT_ORCHESTRATION, SHARED_CONTRACTS]
    contract: Tool-call detection, attempt identity, execution trigger, completion event, and result handoff.
    impact_when: Parsing, call identity, completion payload, dispatch, or result semantics change.

  - id: PAGE_DELIVERY
    owner: CONTENT_ORCHESTRATION
    participants: [CONTENT_ORCHESTRATION, SITE_ADAPTERS, RENDERER, UI_COMPONENTS]
    contract: Retained result delivery to the authorized page destination and observable user-facing outcome.
    impact_when: Destination binding, insertion/submission, per-checkpoint receipt persistence, retry/recovery, page acknowledgement, or presentation changes.

  - id: EXTENSION_ARTIFACT
    owner: BUILD_PACKAGING
    participants: [BUILD_PACKAGING, BACKGROUND_LIFECYCLE, TRANSPORT_PLUGINS, UI_COMPONENTS]
    contract: Browser manifests, packaged source composition, build inputs, and Chrome/Firefox artifact generation.
    impact_when: Manifest, entry point, bundled dependency, target conversion, packaging, or build input changes.

  - id: DOCUMENTATION_EVIDENCE_LIFECYCLE
    owner: CONTROL_DOCUMENTATION
    participants: [CONTROL_DOCUMENTATION, EVIDENCE_DOCUMENTATION, MODULE_DOCUMENTATION, PRODUCT_DOCUMENTATION]
    contract: Routing, local contracts, qualification receipts, and historical product documentation remain linked without competing mutable facts.
    impact_when: A documentation owner, topology rule, receipt schema/status, module contract, or product support claim changes.

  - id: TOOLING_VERIFICATION_PIPELINE
    owner: REPOSITORY_TOOLING
    participants: [REPOSITORY_TOOLING, VERIFICATION_INFRASTRUCTURE, BUILD_PACKAGING]
    contract: Repository toolchain configuration, deterministic fixtures, and artifact-generation gates remain distinguishable but compatible.
    impact_when: Compiler, package-manager, lint/format, test-harness, fixture, or build-gate semantics change. Ignore-only changes such as `.gitignore` do not cross this interface unless they alter an input used by a gate or artifact.

boundaries:
  - id: CONTROL_DOCUMENTATION
    paths: [AGENTS.md, SYSTEM.md, ARCHITECTURE.md, AGENT_GUIDE.md, DIAGNOSIS.md, AGENT_SYSTEM_DESIGN.md, docs/agent-control-map.yaml]
    owns:
      - agent routing, control-loop semantics, topology, and verification procedure
      - system invariants and the active agent-ergonomics plan
    invariants: [ONE_FACT_ONE_HOME, ABSTRACTION_GRADIENT, ACTION_ADMISSION]
    observability: [documentation link/reference checks, topology validation output]
    verification_dimensions: [documentation, topology, routing, plan-consistency]
    documentation:
      contract: AGENTS.md#documentation-locality
      detail: ARCHITECTURE.md#bidirectional-control-graph
    evidence_families: [AGENT_RETRIEVAL, ISSUE_DISPOSITION]

  - id: EVIDENCE_DOCUMENTATION
    paths: [docs/qualification/**]
    owns:
      - scoped qualification receipts, status, provenance, and invalidation
      - support and issue-disposition evidence
    invariants: [ONE_FACT_ONE_HOME, QUALIFICATION_IS_SCOPED, DEPENDENCY_SCOPED_EVIDENCE]
    observability: [receipt fields, revision/scope identity, dependency descriptors/fingerprints, invalidation records]
    verification_dimensions: [qualification, evidence-provenance, evidence-dependency, freshness, documentation]
    documentation:
      contract: docs/qualification/README.md
      detail: docs/qualification/issue-coverage-ledger.md
    evidence_families: [AGENT_RETRIEVAL, ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, SUPPORT_QUALIFICATION]

  - id: MODULE_DOCUMENTATION
    paths: [packages/**/README.md, pages/**/README.md]
    owns:
      - module-local contracts, source ownership, and maintenance procedures
    invariants: [ONE_FACT_ONE_HOME]
    observability: [source-path/reference checks, local contract review]
    verification_dimensions: [documentation, source-contract, links]
    documentation:
      contract: AGENTS.md#documentation-locality
      detail: ARCHITECTURE.md#behavior-ownership-map
    evidence_families: [AGENT_RETRIEVAL]

  - id: PRODUCT_DOCUMENTATION
    paths: [README.md, CHANGELOG.md, RELEASE_NOTES.md, DEFERRED_ISSUES.md]
    owns:
      - user-facing product claims and historically scoped release/issue records
    invariants: [ONE_FACT_ONE_HOME, QUALIFICATION_IS_SCOPED]
    observability: [link checks, dated revision scope, implementation comparison]
    verification_dimensions: [documentation, product-claims, historical-scope]
    documentation:
      contract: AGENTS.md#documentation-locality
      detail: README.md
    evidence_families: [SUPPORT_QUALIFICATION, ISSUE_DISPOSITION]

  - id: BACKGROUND_LIFECYCLE
    paths: [chrome-extension/src/background/**]
    owns:
      - cross-tab and server connection lifecycle
      - content-to-client message routing and broadcasts
      - extension install, update, and health-check behavior
    invariants: [BOUNDARY_OWNERSHIP, CONNECTION_STATE_MACHINE, OPERATION_CHECKPOINTS]
    observability: [service-worker console, background state and message tests]
    verification_dimensions: [background-lifecycle, message-contract, browser-runtime]
    documentation:
      model: SYSTEM.md#layer-1-background-script-chrome-extensionsrcbackground
      detail: ARCHITECTURE.md#layer-diagram-with-file-paths
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, SUPPORT_QUALIFICATION]

  - id: MCP_CLIENT
    paths: [chrome-extension/src/mcpclient/**]
    owns:
      - MCP protocol normalization and request lifecycle
      - tool discovery and invocation
      - client health, cancellation, and schema validation
    invariants: [BOUNDARY_OWNERSHIP, OPERATION_CHECKPOINTS, EFFECT_SAFE_RETRY, ACTION_ADMISSION]
    observability: [MCP client events, node regression tests]
    verification_dimensions: [protocol, discovery, cancellation, schema-validation]
    documentation:
      model: SYSTEM.md#layer-2-mcp-client-chrome-extensionsrcmcpclient
      detail: ARCHITECTURE.md#transport-plugin-architecture
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, SUPPORT_QUALIFICATION]

  - id: TRANSPORT_PLUGINS
    paths: [chrome-extension/src/mcpclient/plugins/**]
    owns:
      - SSE, WebSocket, and Streamable HTTP framing and lifecycle
      - transport URI support and health reporting
    invariants: [BOUNDARY_OWNERSHIP, CONNECTION_STATE_MACHINE, EFFECT_SAFE_RETRY]
    observability: [transport fixtures and tests, MCP client health events]
    verification_dimensions: [transport, framing, reconnect, protocol-selection]
    documentation:
      model: SYSTEM.md#layer-2-mcp-client-chrome-extensionsrcmcpclient
      detail: ARCHITECTURE.md#transport-plugin-architecture
    evidence_families: [ISSUE_DISPOSITION, SUPPORT_QUALIFICATION]

  - id: CONTENT_ORCHESTRATION
    paths:
      - pages/content/src/index.ts
      - pages/content/src/initializer.ts
      - pages/content/src/core/**
      - pages/content/src/services/**
    owns:
      - content-script initialization and service orchestration
      - operation identity, delivery receipts, bounded recovery, and observation
      - content-to-background context bridging
    invariants: [OPERATION_CHECKPOINTS, CHECKPOINT_MONOTONICITY, EFFECT_SAFE_RETRY, DESTINATION_INTEGRITY, ACTION_ADMISSION]
    observability:
      - window._appDebug services in development builds
      - window.__automationService in development builds
      - bounded delivery receipts in localStorage
    verification_dimensions: [content-lifecycle, operation-correlation, delivery-recovery, resume]
    documentation:
      contract: pages/content/src/services/README.md
      detail: ARCHITECTURE.md#runtime-operation-contract
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, AGENT_RETRIEVAL]

  - id: CONTENT_STATE_EVENTS
    paths:
      - pages/content/src/stores/**
      - pages/content/src/events/**
      - pages/content/src/hooks/**
    owns:
      - Zustand application state
      - typed cross-component events and subscriptions
      - React access to shared content state
    invariants: [CONNECTION_STATE_MACHINE, OPERATION_CHECKPOINTS, CHECKPOINT_MONOTONICITY]
    observability: [window._appDebug stores in development builds, typed event-bus listeners]
    verification_dimensions: [state-contract, event-contract, content-lifecycle]
    documentation:
      contract: pages/content/src/stores/README.md
      detail: ARCHITECTURE.md#state-management-details
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP]

  - id: RENDERER
    paths: [pages/content/src/render_prescript/**]
    owns:
      - JSONL tool-call detection and parsing
      - tool-card rendering and execution trigger
      - renderer-to-content completion signaling
    invariants: [OPERATION_CHECKPOINTS, DESTINATION_INTEGRITY]
    observability: [mcp:tool-execution-complete DOM event, rendered cards and browser console]
    verification_dimensions: [renderer, parsing, operation-correlation, site]
    documentation:
      model: SYSTEM.md#layer-3-content-script-pagescontentsrc
      detail: ARCHITECTURE.md#current-tool-execution-flow
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, SUPPORT_QUALIFICATION]

  - id: SITE_ADAPTERS
    paths: [pages/content/src/plugins/**]
    owns:
      - hostname matching and adapter lifecycle
      - site-specific DOM insertion, submission, attachment, and selectors
      - declared page capabilities
    invariants: [BOUNDARY_OWNERSHIP, DESTINATION_INTEGRITY, QUALIFICATION_IS_SCOPED, ACTION_ADMISSION]
    observability: [window.__pluginSystem in development builds, live DOM and adapter acknowledgements]
    verification_dimensions: [site, adapter-contract, browser-runtime, delivery]
    documentation:
      contract: pages/content/src/plugins/adapters/README.md
      detail: ARCHITECTURE.md#adding-a-new-adapter
    evidence_families: [ISSUE_DISPOSITION, SUPPORT_QUALIFICATION]

  - id: UI_COMPONENTS
    paths:
      - pages/content/src/components/**
      - packages/ui/**
    owns:
      - sidebar, tool popover, settings, notifications, and presentation
      - shadow-DOM component behavior
    invariants: [OPERATION_CHECKPOINTS]
    observability: [shadow-DOM inspection, browser UI behavior]
    verification_dimensions: [ui, accessibility, site, browser-runtime]
    documentation:
      contract: pages/content/src/components/README.md
      detail: ARCHITECTURE.md#layer-diagram-with-file-paths
    evidence_families: [ISSUE_DISPOSITION, SUPPORT_QUALIFICATION]

  - id: SHARED_CONTRACTS
    paths:
      - packages/shared/**
      - pages/content/src/types/**
      - chrome-extension/src/mcpclient/types/**
    owns:
      - producer-consumer message and state shapes
      - cross-boundary TypeScript contracts
    invariants: [CONNECTION_STATE_MACHINE, OPERATION_CHECKPOINTS]
    observability: [producer-consumer source inspection, TypeScript type checking]
    verification_dimensions: [shared-contract, serialization, producer-consumer]
    documentation:
      contract: pages/content/src/types/README.md
      detail: ARCHITECTURE.md#message-protocol
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP]

  - id: REPOSITORY_TOOLING
    paths:
      - .gitignore
      - .npmrc
      - .nvmrc
      - .prettierignore
      - .prettierrc
      - eslint.config.ts
      - tsconfig.json
    owns:
      - repository-level ignore, runtime-version, formatting, lint, and TypeScript configuration
      - tooling semantics that can change what verification commands inspect or accept
    invariants: [ONE_FACT_ONE_HOME]
    observability: [tooling/config diff, resolved command behavior]
    verification_dimensions: [repository-tooling, formatting, lint-configuration, type-configuration]
    documentation:
      procedure: AGENT_GUIDE.md#verification-workflow
    evidence_families: [ISSUE_DISPOSITION, AGENT_RETRIEVAL]

  - id: VERIFICATION_INFRASTRUCTURE
    paths:
      - chrome-extension/tests/**
      - packages/e2e/**
      - packages/e2e/benchmark-agent.mjs
      - packages/e2e/agent-inspect.mjs
      - packages/test-mcp-fixture/**
    owns:
      - deterministic regression and end-to-end test fixtures
      - verification harness behavior and test-only server semantics
    invariants: [QUALIFICATION_IS_SCOPED]
    observability: [test source, fixture source, regression and E2E output]
    verification_dimensions: [test-contract, regression-fixture, e2e-fixture]
    documentation:
      procedure: AGENT_GUIDE.md#verification-workflow
      evidence: docs/qualification/README.md
    evidence_families: [ISSUE_DISPOSITION, OPERATION_ROUND_TRIP, SUPPORT_QUALIFICATION]

  - id: BUILD_PACKAGING
    paths:
      - chrome-extension/manifest.ts
      - chrome-extension/vite.config.mts
      - chrome-extension/utils/plugins/make-manifest-plugin.ts
      - chrome-extension/pre-build.tsconfig.json
      - chrome-extension/package.json
      - packages/dev-utils/lib/manifest-parser/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
    owns:
      - Chrome and Firefox artifact generation
      - manifest conversion and workspace build inputs
      - dependency and script wiring
    invariants: [QUALIFICATION_IS_SCOPED]
    observability: [generated manifests and build artifacts, package scripts and build output]
    verification_dimensions: [chrome-artifact, firefox-artifact, manifest, dependencies]
    documentation:
      procedure: AGENT_GUIDE.md#verification-workflow
      evidence: docs/qualification/support-matrix.md
    evidence_families: [SUPPORT_QUALIFICATION]
